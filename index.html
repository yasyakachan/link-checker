<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Link Checker</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      color: #1a1a1a;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      border: 1px solid #e5e5e5;
      width: 100%;
      max-width: 680px;
      overflow: hidden;
    }

    .header {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: #FF00AA;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo i { color: #fff; font-size: 18px; }

    .header-text h1 {
      font-size: 17px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .header-text p {
      font-size: 13px;
      color: #888;
      margin-top: 1px;
    }

    .body { padding: 1.75rem 2rem; }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 1rem;
    }

    .input-row input {
      flex: 1;
      height: 42px;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 0 14px;
      font-size: 14px;
      color: #1a1a1a;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .input-row input:focus {
      border-color: #FF00AA;
      box-shadow: 0 0 0 3px rgba(255, 0, 170, 0.1);
    }

    .input-row input::placeholder { color: #bbb; }

    .btn {
      height: 42px;
      padding: 0 20px;
      border-radius: 10px;
      border: none;
      background: #FF00AA;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: opacity 0.15s;
    }

    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-blog {
      height: 42px;
      padding: 0 20px;
      border-radius: 10px;
      border: 1px solid #ddd;
      background: #fff;
      color: #1a1a1a;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .btn-blog:hover { border-color: #FF00AA; color: #FF00AA; }
    .btn-blog:disabled { opacity: 0.5; cursor: not-allowed; }

    .sources {
      display: flex;
      gap: 8px;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .source-tag {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid #eee;
      color: #888;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .dot { width: 6px; height: 6px; border-radius: 50%; }
    .dot-zd { background: #0088FF; }
    .dot-rm { background: #FF00AA; }
    .dot-blog { background: #00AA44; }

    .blog-section {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid #f0f0f0;
    }

    .blog-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .blog-section-title {
      font-size: 14px;
      font-weight: 500;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .blog-note {
      font-size: 12px;
      color: #bbb;
      margin-bottom: 10px;
    }

    .status {
      font-size: 13px;
      color: #888;
      margin-bottom: 1rem;
      min-height: 20px;
    }

    .blog-status {
      font-size: 13px;
      color: #888;
      margin-top: 10px;
      min-height: 20px;
    }

    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid #eee;
      border-top-color: #FF00AA;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: -2px;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .results { display: flex; flex-direction: column; gap: 8px; }

    .result-card {
      background: #fafafa;
      border: 1px solid #efefef;
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: border-color 0.15s;
    }

    .result-card:hover { border-color: #ddd; }

    .source-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 20px;
      white-space: nowrap;
      flex-shrink: 0;
      margin-top: 2px;
      letter-spacing: 0.02em;
    }

    .badge-zd { background: rgba(0,136,255,0.1); color: #0066CC; }
    .badge-rm { background: rgba(255,0,170,0.1); color: #CC0088; }
    .badge-blog { background: rgba(0,170,68,0.1); color: #007733; }

    .result-info { flex: 1; min-width: 0; }

    .result-title {
      font-size: 14px;
      font-weight: 500;
      color: #1a1a1a;
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .result-url {
      font-size: 12px;
      color: #bbb;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .result-link {
      color: #bbb;
      text-decoration: none;
      flex-shrink: 0;
      transition: color 0.15s;
    }

    .result-link:hover { color: #FF00AA; }

    .empty {
      text-align: center;
      padding: 3rem 1rem;
      color: #bbb;
    }

    .empty i { font-size: 40px; display: block; margin-bottom: 8px; }

    .count-badge {
      font-size: 13px;
      color: #888;
      margin-bottom: 1rem;
    }

    .count-badge strong { color: #1a1a1a; }

    .error-msg { color: #cc0000; font-size: 13px; }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <div class="logo"><i class="ti ti-link"></i></div>
    <div class="header-text">
      <h1>Link Checker</h1>
      <p>Знайди де використовується лінк перед видаленням</p>
    </div>
  </div>

  <div class="body">
    <div class="input-row">
      <input type="text" id="urlInput" placeholder="https://setapp.com/pricing" />
      <button class="btn" id="checkBtn" onclick="checkLink()">
        <i class="ti ti-search"></i> Перевірити
      </button>
    </div>

    <div class="sources">
      <div class="source-tag"><span class="dot dot-zd"></span> Knowledge Base</div>
      <div class="source-tag"><span class="dot dot-rm"></span> Developer Guide</div>
    </div>

    <div class="status" id="status"></div>
    <div id="results"></div>

    <div class="blog-section">
      <div class="blog-section-header">
        <div class="blog-section-title">
          <span class="dot dot-blog"></span> Blog
        </div>
        <button class="btn-blog" id="blogBtn" onclick="checkBlog()">
          <i class="ti ti-brand-blogger"></i> Шукати в блозі
        </button>
      </div>
      <div class="blog-note">Пошук може тривати до 30 хвилин</div>
      <div class="blog-status" id="blogStatus"></div>
      <div id="blogResults"></div>
    </div>
  </div>
</div>

<script>
  let blogPollInterval = null;

  async function checkLink() {
    const url = document.getElementById('urlInput').value.trim();
    if (!url) return;

    const btn = document.getElementById('checkBtn');
    const status = document.getElementById('status');
    const results = document.getElementById('results');

    btn.disabled = true;
    status.innerHTML = '<span class="spinner"></span> Сканування...';
    results.innerHTML = '';

    try {
      const res = await fetch('https://n8n.macpaw.dev/webhook/link-checker', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url })
      });

      const data = await res.json();
      const items = Array.isArray(data) ? data[0] : data;
      const list = items.results || [];

      if (list.length === 0) {
        status.innerHTML = '';
        results.innerHTML = '<div class="empty"><i class="ti ti-circle-check"></i>Лінк не знайдено в жодній статті</div>';
      } else {
        const word = list.length === 1 ? 'стаття' : list.length < 5 ? 'статті' : 'статей';
        status.innerHTML = '';
        results.innerHTML =
          `<div class="count-badge"><strong>${list.length}</strong> ${word} містить цей лінк</div>` +
          '<div class="results">' +
          list.map(r => {
            let badgeClass = 'badge-rm';
            let badgeLabel = 'Developer Guide';
            if (r.source === 'Zendesk Help Center') { badgeClass = 'badge-zd'; badgeLabel = 'Knowledge Base'; }
            if (r.source === 'README Docs') { badgeClass = 'badge-rm'; badgeLabel = 'Developer Guide'; }
            return `
              <div class="result-card">
                <span class="source-badge ${badgeClass}">${badgeLabel}</span>
                <div class="result-info">
                  <div class="result-title">${r.title || r.url || 'Знайдено'}</div>
                  <div class="result-url">${r.url || 'Знайдено'}</div>
                </div>
                <a href="${r.url}" class="result-link" target="_blank"><i class="ti ti-external-link"></i></a>
              </div>
            `;
          }).join('') +
          '</div>';
      }
    } catch (e) {
      status.innerHTML = '<span class="error-msg"><i class="ti ti-alert-circle"></i> Помилка з\'єднання з n8n.</span>';
    }

    btn.disabled = false;
  }

  async function checkBlog() {
    const url = document.getElementById('urlInput').value.trim();
    if (!url) { alert('Спочатку введи лінк'); return; }

    const btn = document.getElementById('blogBtn');
    const blogStatus = document.getElementById('blogStatus');
    const blogResults = document.getElementById('blogResults');

    if (blogPollInterval) clearInterval(blogPollInterval);

    btn.disabled = true;
    blogStatus.innerHTML = '<span class="spinner"></span> Запускаємо сканування блогу...';
    blogResults.innerHTML = '';

    try {
      const res = await fetch('https://n8n.macpaw.dev/webhook/blog-scanner', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url })
      });

      const data = await res.json();
      const jobId = data.jobId;

      if (!jobId) throw new Error('No jobId');

      blogStatus.innerHTML = '<span class="spinner"></span> Сканування в процесі...';

      blogPollInterval = setInterval(async () => {
        try {
          const statusRes = await fetch(`https://n8n.macpaw.dev/webhook/blog-status?jobId=${jobId}`);
          const statusData = await statusRes.json();
          const job = Array.isArray(statusData) ? statusData[0] : statusData;

          if (job && job.status === 'done') {
            clearInterval(blogPollInterval);
            btn.disabled = false;

            const list = job.results ? JSON.parse(job.results) : [];

            if (list.length === 0) {
              blogStatus.innerHTML = '';
              blogResults.innerHTML = '<div class="empty"><i class="ti ti-circle-check"></i>Лінк не знайдено в блозі</div>';
            } else {
              const word = list.length === 1 ? 'стаття' : list.length < 5 ? 'статті' : 'статей';
              blogStatus.innerHTML = '';
              blogResults.innerHTML =
                `<div class="count-badge"><strong>${list.length}</strong> ${word} в блозі містить цей лінк</div>` +
                '<div class="results">' +
                list.map(r => `
                  <div class="result-card">
                    <span class="source-badge badge-blog">Blog</span>
                    <div class="result-info">
                      <div class="result-title">${r.title || r.url}</div>
                      <div class="result-url">${r.url}</div>
                    </div>
                    <a href="${r.url}" class="result-link" target="_blank"><i class="ti ti-external-link"></i></a>
                  </div>
                `).join('') +
                '</div>';
            }
          }
        } catch (e) {}
      }, 5000);

    } catch (e) {
      blogStatus.innerHTML = '<span class="error-msg"><i class="ti ti-alert-circle"></i> Помилка запуску сканування блогу.</span>';
      btn.disabled = false;
    }
  }

  document.getElementById('urlInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') checkLink();
  });
</script>

</body>
</html>
