<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Link Checker</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.5rem 2rem;
      color: #1a1a1a;
    }

    .page-header {
      width: 100%;
      max-width: 720px;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #FF00AA;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo i { color: #fff; font-size: 22px; }

    .page-title {
      font-size: 28px;
      font-weight: 700;
      color: #000;
      letter-spacing: -0.5px;
    }

    .search-wrap {
      width: 100%;
      max-width: 720px;
      position: relative;
      margin-bottom: 1rem;
    }

    .search-wrap input {
      width: 100%;
      height: 48px;
      border: 1.5px solid #e0e0e0;
      border-radius: 12px;
      padding: 0 44px 0 16px;
      font-size: 15px;
      color: #1a1a1a;
      outline: none;
      background: #fff;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .search-wrap input:focus {
      border-color: #FF00AA;
      box-shadow: 0 0 0 3px rgba(255, 0, 170, 0.1);
    }

    .search-wrap input::placeholder { color: #bbb; }

    .clear-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #bbb;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 50%;
      transition: color 0.15s, background 0.15s;
    }

    .clear-btn:hover { color: #666; background: #f0f0f0; }
    .clear-btn.visible { display: flex; }

    .actions {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 720px;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .btn-action {
      height: 40px;
      padding: 0 18px;
      border-radius: 20px;
      border: 1.5px solid #e0e0e0;
      background: #fff;
      color: #1a1a1a;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .btn-action:hover:not(:disabled) {
      border-color: #FF00AA;
      color: #FF00AA;
    }

    .btn-action.active {
      background: #FF00AA;
      border-color: #FF00AA;
      color: #fff;
    }

    .btn-action:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-action .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-zd { background: #0088FF; }
    .dot-rm { background: #FF00AA; }
    .dot-blog { background: #34C759; }
    .dot-email { background: #FFCC00; }

    .btn-action.active .dot-zd { background: rgba(255,255,255,0.8); }
    .btn-action.active .dot-rm { background: rgba(255,255,255,0.8); }
    .btn-action.active .dot-blog { background: rgba(255,255,255,0.8); }

    .card {
      background: #fff;
      border-radius: 16px;
      border: 1px solid #e8e8e8;
      width: 100%;
      max-width: 720px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .card-header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .card-body { padding: 1.25rem 1.5rem; }

    .status {
      font-size: 13px;
      color: #888;
      min-height: 20px;
    }

    .blog-note {
      font-size: 12px;
      color: #bbb;
    }

    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid #eee;
      border-top-color: #FF00AA;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: -2px;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .results { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }

    .result-card {
      background: #fafafa;
      border: 1px solid #efefef;
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: border-color 0.15s;
    }

    .result-card:hover { border-color: #ddd; }

    .source-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 20px;
      white-space: nowrap;
      flex-shrink: 0;
      margin-top: 2px;
      letter-spacing: 0.02em;
    }

    .badge-zd { background: rgba(0,136,255,0.1); color: #0066CC; }
    .badge-rm { background: rgba(255,0,170,0.1); color: #CC0088; }
    .badge-blog { background: rgba(52,199,89,0.12); color: #1a7a36; }

    .result-info { flex: 1; min-width: 0; }

    .result-title {
      font-size: 14px;
      font-weight: 500;
      color: #1a1a1a;
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .result-url {
      font-size: 12px;
      color: #bbb;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .result-link {
      color: #bbb;
      text-decoration: none;
      flex-shrink: 0;
      transition: color 0.15s;
    }

    .result-link:hover { color: #FF00AA; }

    .empty {
      text-align: center;
      padding: 2rem 1rem;
      color: #bbb;
      font-size: 13px;
    }

    .empty i { font-size: 32px; display: block; margin-bottom: 8px; color: #ddd; }

    .count-badge {
      font-size: 13px;
      color: #888;
      margin-bottom: 4px;
    }

    .count-badge strong { color: #1a1a1a; }

    .error-msg { color: #cc0000; font-size: 13px; }

    .nothing-found {
      font-size: 13px;
      color: #bbb;
      padding: 0.5rem 0;
    }
  </style>
</head>
<body>

<div class="page-header">
  <div class="logo"><i class="ti ti-link"></i></div>
  <h1 class="page-title">Link Checker</h1>
</div>

<div class="search-wrap">
  <input type="text" id="urlInput" placeholder="https://setapp.com/pricing" />
  <button class="clear-btn" id="clearBtn" onclick="clearInput()" title="Clear">
    <i class="ti ti-x" style="font-size:16px;"></i>
  </button>
</div>

<div class="actions">
  <button class="btn-action" id="btnGuides" onclick="checkLink()">
    <span class="dot dot-rm"></span> Search in Guides
  </button>
  <button class="btn-action" id="btnBlog" onclick="checkBlog()">
    <span class="dot dot-blog"></span> Search in Blog
  </button>
  <button class="btn-action" id="btnEmail" onclick="checkEmail()">
    <span class="dot dot-email"></span> Search in Emails
  </button>
</div>

<!-- Guides results card -->
<div class="card" id="guidesCard" style="display:none;">
  <div class="card-header">
    <div class="card-title">
      <span class="dot dot-rm"></span> Guides
    </div>
    <span class="blog-note" id="guidesNote"></span>
  </div>
  <div class="card-body">
    <div class="status" id="guidesStatus"></div>
    <div id="guidesResults"></div>
  </div>
</div>

<!-- Email results card -->
<div class="card" id="emailCard" style="display:none;">
  <div class="card-header">
    <div class="card-title">
      <span class="dot dot-email"></span> Emails
    </div>
    <span class="blog-note" id="emailNote"></span>
  </div>
  <div class="card-body">
    <div class="status" id="emailStatus"></div>
    <div id="emailResults"></div>
  </div>
</div>

<!-- Blog results card -->
<div class="card" id="blogCard" style="display:none;">
  <div class="card-header">
    <div class="card-title">
      <span class="dot dot-blog"></span> Blog
    </div>
    <span class="blog-note" id="blogNote"></span>
  </div>
  <div class="card-body">
    <div class="status" id="blogStatus"></div>
    <div id="blogResults"></div>
  </div>
</div>

<script>
  let blogPollIntervals = [];
  let emailPollInterval = null;

  const urlInput = document.getElementById('urlInput');
  const clearBtn = document.getElementById('clearBtn');

  urlInput.addEventListener('input', () => {
    clearBtn.classList.toggle('visible', urlInput.value.length > 0);
  });

  urlInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') checkLink();
  });

  function clearInput() {
    urlInput.value = '';
    clearBtn.classList.remove('visible');
    urlInput.focus();
  }

  async function checkLink() {
    const url = urlInput.value.trim();
    if (!url) return;

    const btn = document.getElementById('btnGuides');
    const guidesCard = document.getElementById('guidesCard');
    const guidesStatus = document.getElementById('guidesStatus');
    const guidesResults = document.getElementById('guidesResults');
    const guidesNote = document.getElementById('guidesNote');

    btn.disabled = true;
    btn.classList.add('active');
    guidesCard.style.display = 'block';
    guidesStatus.innerHTML = '<span class="spinner"></span> Scanning…';
    guidesResults.innerHTML = '';
    guidesNote.textContent = '';

    try {
      const res = await fetch('https://n8n.macpaw.dev/webhook/link-checker', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url })
      });

      const data = await res.json();
      const items = Array.isArray(data) ? data[0] : data;
     const list = (items.results || []).filter(r => r.url);

      guidesStatus.innerHTML = '';

      if (list.length === 0) {
        guidesResults.innerHTML = '<div class="nothing-found"><i class="ti ti-circle-x" style="color:#ddd;margin-right:6px;"></i>Nothing found</div>';
      } else {
        const word = list.length === 1 ? 'article' : 'articles';
        guidesNote.textContent = `${list.length} ${word}`;
        guidesResults.innerHTML =
          '<div class="results">' +
          list.map(r => {
            let badgeClass = 'badge-rm';
            let badgeLabel = 'Developer Guide';
            if (r.source === 'Zendesk Help Center') { badgeClass = 'badge-zd'; badgeLabel = 'Knowledge Base'; }
            return `
              <div class="result-card">
                <span class="source-badge ${badgeClass}">${badgeLabel}</span>
                <div class="result-info">
                  <div class="result-title">${r.title || r.url}</div>
                  <div class="result-url">${r.url}</div>
                </div>
                <a href="${r.url}" class="result-link" target="_blank"><i class="ti ti-external-link"></i></a>
              </div>
            `;
          }).join('') +
          '</div>';
      }
    } catch (e) {
      guidesStatus.innerHTML = '<span class="error-msg"><i class="ti ti-alert-circle"></i> Connection error.</span>';
    }

    btn.disabled = false;
    btn.classList.remove('active');
  }

  async function checkBlog() {
    const url = urlInput.value.trim();
    if (!url) { alert('Please enter a link first'); return; }

    const btn = document.getElementById('btnBlog');
    const blogCard = document.getElementById('blogCard');
    const blogStatus = document.getElementById('blogStatus');
    const blogResults = document.getElementById('blogResults');
    const blogNote = document.getElementById('blogNote');

    blogPollIntervals.forEach(id => clearInterval(id));
    blogPollIntervals = [];

    btn.disabled = true;
    btn.classList.add('active');
    blogCard.style.display = 'block';
    blogStatus.innerHTML = '<span class="spinner"></span> Starting scan…';
    blogResults.innerHTML = '';
    blogNote.textContent = 'Search may take up to 3 minutes';

    try {
      const offsets = [0, 500, 1000];
      const jobResponses = await Promise.all(offsets.map(offset =>
        fetch('https://n8n.macpaw.dev/webhook/blog-scanner', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url, offset })
        }).then(r => r.json())
      ));

      const jobIds = jobResponses.map(d => d.jobId);
      if (jobIds.some(id => !id)) throw new Error('Missing jobId');

      const jobState = jobIds.reduce((acc, id) => {
        acc[id] = { done: false, results: [] };
        return acc;
      }, {});

      blogStatus.innerHTML = '<span class="spinner"></span> Scanning… (0 / 3 parts done)';

      function renderResults() {
        const doneCount = Object.values(jobState).filter(s => s.done).length;
        const allDone = doneCount === 3;

        if (!allDone) {
          blogStatus.innerHTML = `<span class="spinner"></span> Scanning… (${doneCount} / 3 parts done)`;
          return;
        }

        btn.disabled = false;
        btn.classList.remove('active');
        blogPollIntervals.forEach(id => clearInterval(id));
        blogPollIntervals = [];

        const allResults = Object.values(jobState).flatMap(s => s.results);
        blogNote.textContent = '';

        if (allResults.length === 0) {
          blogStatus.innerHTML = '';
          blogResults.innerHTML = '<div class="nothing-found"><i class="ti ti-circle-x" style="color:#ddd;margin-right:6px;"></i>Nothing found</div>';
        } else {
          const word = allResults.length === 1 ? 'article' : 'articles';
          blogNote.textContent = `${allResults.length} ${word}`;
          blogStatus.innerHTML = '';
          blogResults.innerHTML =
            '<div class="results">' +
            allResults.map(r => `
              <div class="result-card">
                <span class="source-badge badge-blog">Blog</span>
                <div class="result-info">
                  <div class="result-title">${r.title || r.url}</div>
                  <div class="result-url">${r.url}</div>
                </div>
                <a href="${r.url}" class="result-link" target="_blank"><i class="ti ti-external-link"></i></a>
              </div>
            `).join('') +
            '</div>';
        }
      }

      jobIds.forEach(jobId => {
        const intervalId = setInterval(async () => {
          if (jobState[jobId].done) return;
          try {
            const statusRes = await fetch(`https://n8n.macpaw.dev/webhook/blog-status?jobId=${jobId}`);
            const statusData = await statusRes.json();
            const job = Array.isArray(statusData) ? statusData[0] : statusData;
            if (job && job.status === 'done') {
              jobState[jobId].done = true;
              jobState[jobId].results = job.results ? JSON.parse(job.results) : [];
              renderResults();
            }
          } catch (e) {}
        }, 5000);
        blogPollIntervals.push(intervalId);
      });

    } catch (e) {
      blogStatus.innerHTML = '<span class="error-msg"><i class="ti ti-alert-circle"></i> Failed to start scan.</span>';
      btn.disabled = false;
      btn.classList.remove('active');
    }
  }
  async function checkEmail() {
    const url = urlInput.value.trim();
    if (!url) { alert('Please enter a link first'); return; }

    const btn = document.getElementById('btnEmail');
    const emailCard = document.getElementById('emailCard');
    const emailStatus = document.getElementById('emailStatus');
    const emailResults = document.getElementById('emailResults');
    const emailNote = document.getElementById('emailNote');

    if (emailPollInterval) clearInterval(emailPollInterval);

    btn.disabled = true;
    btn.classList.add('active');
    emailCard.style.display = 'block';
    emailStatus.innerHTML = '<span class="spinner"></span> Starting scan…';
    emailResults.innerHTML = '';
    emailNote.textContent = 'Search may take a few minutes';

    try {
      const res = await fetch('https://n8n.macpaw.dev/webhook/email-scanner', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url })
      });

      const data = await res.json();
      const jobId = data.jobId;
      if (!jobId) throw new Error('Missing jobId');

      emailStatus.innerHTML = '<span class="spinner"></span> Scanning emails…';

      emailPollInterval = setInterval(async () => {
        try {
          const statusRes = await fetch(`https://n8n.macpaw.dev/webhook/blog-status?jobId=${jobId}`);
          const statusData = await statusRes.json();
          const job = Array.isArray(statusData) ? statusData[0] : statusData;

          if (job && job.status === 'done') {
            clearInterval(emailPollInterval);
            btn.disabled = false;
            btn.classList.remove('active');

            const list = job.results ? JSON.parse(job.results) : [];
            emailNote.textContent = '';

            if (list.length === 0) {
              emailStatus.innerHTML = '';
              emailResults.innerHTML = '<div class="nothing-found"><i class="ti ti-circle-x" style="color:#ddd;margin-right:6px;"></i>Nothing found</div>';
            } else {
              const word = list.length === 1 ? 'email' : 'emails';
              emailNote.textContent = `${list.length} ${word}`;
              emailStatus.innerHTML = '';
              emailResults.innerHTML =
                '<div class="results">' +
                list.map(r => `
                  <div class="result-card">
                    <span class="source-badge" style="background:rgba(255,204,0,0.15);color:#996600;">Email</span>
                    <div class="result-info">
                      <div class="result-title">${r.name || r.previewUrl}</div>
                      <div class="result-url">${r.previewUrl || ''}</div>
                    </div>
                    ${r.previewUrl ? `<a href="${r.previewUrl}" class="result-link" target="_blank"><i class="ti ti-external-link"></i></a>` : ''}
                  </div>
                `).join('') +
                '</div>';
            }
          }
        } catch (e) {}
      }, 5000);

    } catch (e) {
      emailStatus.innerHTML = '<span class="error-msg"><i class="ti ti-alert-circle"></i> Failed to start scan.</span>';
      btn.disabled = false;
      btn.classList.remove('active');
    }
  }
</script>

</body>
</html>
